[package]
name = "vcftools-rs"
version = "0.1.0"
edition = "2021"
description = "Unofficial, faster, byte-identical reimplementation of VCFtools population-genetics statistics"
license = "LGPL-3.0-only"
repository = "https://github.com/OWNER/vcftools-rs"
readme = "../README.md"
keywords = ["bioinformatics", "vcf", "population-genetics", "genomics", "vcftools"]
categories = ["science", "command-line-utilities"]
rust-version = "1.80"

[dependencies]
rayon = "1"
libdeflater = "1"
libc = "0.2"
memchr = "2"
itoa = "1"
flate2 = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
